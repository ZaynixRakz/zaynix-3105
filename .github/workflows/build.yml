name: Build Unsigned IPA Zaynix Sukses

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        default: ZAYNIX
        type: string
      scheme:
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Ambil Source Code dari Repositori
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP Proyek dan Tata Ulang Struktur
        run: |
          ZIP_FILE=$(find . -name '*.zip*' -print -quit)
          if [ -n "$ZIP_FILE" ]; then 
            unzip -o "$ZIP_FILE"
            # Menghapus file ZIP asli setelah diekstrak agar tidak mengganggu proses pencarian proyek oleh mesin build
            rm "$ZIP_FILE"
          fi

      - name: Bangun Ulang Tampilan Aplikasi Zaynix Otomatis (Anti-Error)
        run: |
          TARGET_FILE=$(find . -name 'ContentView.swift' -print -quit)
          if [ -f "$TARGET_FILE" ]; then
            # Mengubah teks OGIOS ke ZAYNIX di tampilan menu visual tanpa menyentuh nama file biner internal
            sed -i '' 's/"OGIOS"/"ZAYNIX"/g' "$TARGET_FILE"
            sed -i '' 's/"PATCH CONTROL CENTER"/"ZAYNIX CONTROL CENTER"/g' "$TARGET_FILE"
            sed -i '' 's/"Developed by OGIOS"/"Developed by ZAYNIX"/g' "$TARGET_FILE"
          fi

      - name: Konfigurasi Bundle ID Baru Aplikasi
        run: |
          PLIST_FILE=$(find . -name 'Info.plist' -print -quit)
          if [ -f "$PLIST_FILE" ]; then
            if which plutil > /dev/null; then
              plutil -replace CFBundleIdentifier -string "${{ github.event.inputs.bundle_id }}" "$PLIST_FILE"
              plutil -replace CFBundleDisplayName -string "${{ github.event.inputs.project_name }}" "$PLIST_FILE"
            fi
          fi

      - name: Eksekusi Xcode Build Engine Dinamis
        run: |
          XCODE_PROJ=$(find . -name '*.xcodeproj' -print -quit)
          XCODE_PROJECT_DIR=$(dirname "$XCODE_PROJ")
          
          # Berpindah secara dinamis ke folder tempat file .xcodeproj berada agar jalur file patch terbaca dengan benar
          cd "$XCODE_PROJECT_DIR"
          
          xcodebuild -project "$(basename "$XCODE_PROJ")" \
                     -scheme "${{ github.event.inputs.scheme }}" \
                     -configuration Release \
                     -archivePath "${{ github.workspace }}/build/ZAYNIX.xcarchive" \
                     clean archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Persiapan Ekspor File Aplikasi
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/ZAYNIX.xcarchive/Products/Applications -name '*.app' -print -quit)
          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" Payload/
          else
            echo "Error: File aplikasi .app tidak ditemukan!"
            exit 1
          fi

      - name: Konversi Menjadi File Mentahan .IPA
        run: |
          zip -qq -r -9 ZAYNIX_Unsigned.ipa Payload

      - name: Amankan Hasil File Aplikasi Untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: ZAYNIX-Menu-Applications
          path: ZAYNIX_Unsigned.ipa
          
