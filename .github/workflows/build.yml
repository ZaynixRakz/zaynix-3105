name: Build Unsigned IPA Zaynix Sukses Final

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        default: com.zanynx.appbaru
        type: string
      project_name:
        default: ZAYNIX
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Ambil Source Code dari Repositori
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP Proyek
        run: |
          ZIP_FILE=$(find . -name '*.zip*' -print -quit)
          if [ -n "$ZIP_FILE" ]; then 
            unzip -o "$ZIP_FILE"
            rm "$ZIP_FILE"
          fi

      - name: Buat Proyek iOS Baru Murni dan Bersih (Bypass Xcode Error)
        run: |
          mkdir -p ZaynixApp/ZaynixApp
          
          # 1. Membuat file App Entry Point murni
          cat << 'EOF' > ZaynixApp/ZaynixApp/ZaynixAppApp.swift
          import SwiftUI

          @main
          struct ZaynixAppApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          # 2. Membuat file Tampilan Visual Utama ZAYNIX + Sistem Kunci Vercel Online
          cat << 'EOF' > ZaynixApp/ZaynixApp/ContentView.swift
          import SwiftUI

          struct ModItem: Identifiable {
              let id = UUID()
              let title: String
              let subtitle: String
              let patchFileName: String
              var isEnabled = false
          }

          struct ContentView: View {
              @State private var inputLicense = ""
              @State private var isLoginSuccess = false
              @State private var remainingDays = ""
              @State private var errorMessage = ""
              @State private var isLoading = false
              @State private var modFeatures: [ModItem] = [
                  ModItem(title: "Aim Drag", subtitle: "FREE FIRE • INJECT", patchFileName: "ZAYNIX File (1)"),
                  ModItem(title: "Aim Hook", subtitle: "FREE FIRE • INJECT", patchFileName: "ZAYNIX File (2)"),
                  ModItem(title: "Antenna W10", subtitle: "FREE FIRE • INJECT", patchFileName: "ZAYNIX File (3)"),
                  ModItem(title: "144 FPS Unlock", subtitle: "FREE FIRE • INJECT", patchFileName: "ZAYNIX File (4)"),
                  ModItem(title: "💎 MOD MENU ZAYNIX", subtitle: "SPECIAL EDITION", patchFileName: "ZAYNIX File (14)")
              ]

              var body: some View {
                  ZStack {
                      Color(red: 0.05, green: 0.05, blue: 0.07).ignoresSafeArea()
                      if !isLoginSuccess {
                          VStack(spacing: 30) {
                              VStack(spacing: 8) {
                                  Text("ZAYNIX").font(.system(size: 48, weight: .black, design: .rounded)).foregroundColor(.white)
                                  Text("VERCEL LICENSED CONTROL CENTER").font(.system(size: 10, weight: .bold)).foregroundColor(.red)
                              }.padding(.top, 80)
                              VStack(alignment: .leading, spacing: 15) {
                                  Text("ENTER ACCESS KEY").font(.caption).bold().foregroundColor(.gray)
                                  TextField("ZAYNIX-XXXXXXXXXX", text: $inputLicense).padding().background(Color.white.opacity(0.04)).cornerRadius(14).foregroundColor(.white).overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.red.opacity(0.3), lineWidth: 1))
                                  if !errorMessage.isEmpty { Text(errorMessage).font(.caption).foregroundColor(.red).bold() }
                              }.padding(.horizontal, 32)
                              Button(action: { checkLicenseFromVercel() }) {
                                  HStack {
                                      if isLoading { ProgressView() }
                                      else { Text("VERIFY VIA VERCEL").font(.headline).bold().foregroundColor(.white) }
                                    }
                                    .frame(maxWidth: .infinity)
                                    .frame(height: 56)
                                    .background(Color.red)
                                    .cornerRadius(14)
                              }.padding(.horizontal, 32).disabled(isLoading)
                              Spacer()
                          }
                      } else {
                          ScrollView {
                              VStack(spacing: 22) {
                                  HStack {
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text("ZAYNIX").font(.system(size: 28, weight: .black)).foregroundColor(.white)
                                          Text("MULTIPACK CONTROL CENTER").font(.caption).foregroundColor(.red).bold()
                                      }
                                      Spacer()
                                      Text("\(remainingDays)").font(.system(size: 11, weight: .bold)).padding(.horizontal, 12).padding(.vertical, 8).background(Color.green.opacity(0.15)).foregroundColor(.green).cornerRadius(20)
                                  }.padding(.horizontal).padding(.top, 15)
                                  
                                  VStack(spacing: 16) {
                                      ForEach($modFeatures) { $feature in
                                          Toggle(isOn: $feature.isEnabled) {
                                              VStack(alignment: .leading, spacing: 4) {
                                                  Text(feature.title).font(.headline).foregroundColor(.white)
                                                  Text(feature.subtitle).font(.caption).foregroundColor(.gray)
                                              }
                                          }.padding().background(Color.white.opacity(0.03)).cornerRadius(12)
                                      }
                                  }.padding(.horizontal)
                              }
                          }
                      }
                  }
              }
              
              func checkLicenseFromVercel() {
                  isLoading = true
                  errorMessage = ""
                  let deviceHWID = UIDevice.current.identifierForVendor?.uuidString ?? "UNKNOWN_HWID"
                  // GANTI tautan di bawah ini dengan URL Vercel asli milik Anda!
                  let urlString = "https://zaynix-apiu.vercel.app/\(inputLicense)&hwid=\(deviceHWID)"
                  guard let url = URL(string: urlString) else { isLoading = false; return }
                  
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      DispatchQueue.main.async {
                          isLoading = false
                          if let data = data, let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                              let status = json["status"] as? String ?? "FAILED"
                              if status == "SUCCESS" {
                                  self.remainingDays = json["expired"] as? String ?? "AKTIF"
                                  self.isLoginSuccess = true
                              } else {
                                  self.errorMessage = json["message"] as? String ?? "Kunci salah atau terpakai di device lain!"
                              }
                          } else {
                              self.errorMessage = "Gagal terhubung ke server Vercel!"
                          }
                      }
                  }.resume()
              }
          }
          EOF

      - name: Kompilasi Kode Swift Menjadi Aplikasi iOS Biner (Bebas Eror Proyek)
        run: |
          cd ZaynixApp
          xcrun -sdk iphoneos swiftc -o ZaynixApp ZaynixApp/*.swift -target arm64-apple-ios15.0

      - name: Ekspor Struktur Folder Aplikasi (.app)
        run: |
          mkdir -p Payload/ZaynixApp.app
          mv ZaynixApp/ZaynixApp Payload/ZaynixApp.app/Info
          
          # Membuat file Info.plist minimal secara murni agar aplikasi bisa diinstal di iOS
          cat << 'EOF' > Payload/ZaynixApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Info</string>
              <key>CFBundleIdentifier</key>
              <string>${{ github.event.inputs.bundle_id }}</string>
              <key>CFBundleName</key>
              <string>${{ github.event.inputs.project_name }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

      - name: Cari dan Masukkan File Patch Asli dari File ZIP Anda
        run: |
          # Menyalin seluruh file patch (.3105) dari zip asli Anda ke dalam struktur aplikasi baru secara otomatis
          mkdir -p Payload/ZaynixApp.app/Patches
          find . -name "*.3105" -exec cp {} Payload/ZaynixApp.app/Patches/ \; || true

      - name: Konversi Menjadi File Aplikasi Matang (.IPA)
        run: |
          zip -qq -r -9 ZAYNIX_Unsigned.ipa Payload

      - name: Amankan Hasil File Aplikasi Untuk Diunduh
        uses: actions/upload-artifact@v4
        with:
          name: ZAYNIX-Menu-Applications
          path: ZAYNIX_Unsigned.ipa
