name: Build Unsigned IPA Zaynix Sukses

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Target bundle identifier
        required: false
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        description: Output IPA name
        required: false
        default: ZAYNIX
        type: string
      scheme:
        description: Xcode scheme
        required: false
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ekstrak Proyek Zaynix
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -name '*.zip*' -print -quit)
          if [ -n "$ZIP_FILE" ]; then
            echo "Mengekstrak $ZIP_FILE..."
            unzip -o "$ZIP_FILE"
          fi

      - name: INTEGRASI SUNTIK OTOMATIS VERCEL PANEL & UNLOCK FF MAX
        run: |
          set -euo pipefail
          TARGET_FILE=$(find . -name 'ContentView.swift' -print -quit)
          if [ -f "$TARGET_FILE" ]; then
            echo "Menyambungkan Aplikasi ke Web Admin Vercel: https://vercel.app"
            
            # 1. Mengubah nama interface dari OGIOS menjadi ZAYNIX
            sed -i '' 's/OGIOS/ZAYNIX/g' "$TARGET_FILE"
            
            # 2. Unlock FF MAX agar bisa dimainkan langsung oleh user
            sed -i '' 's/lockedLaunchButton(title: "FF MAX", subtitle: "Locked • Coming Soon", color: AppTheme.secondaryAccent)/launchButton(title: "FF MAX", subtitle: "Free Fire MAX", color: AppTheme.secondaryAccent, scheme: "freefiremax")/g' "$TARGET_FILE"
            sed -i '' 's/\.accessibilityLabel("FF MAX locked, coming soon")//g' "$TARGET_FILE"
            
            # 3. Menambahkan tombol Mod Menu Zaynix tambahan setelah tombol Magic
            sed -i '' 's/patchCard(name: "Magic", target: "FREE FIRE • NORMAL", package: "OGIOS File (14).3105", color: AppTheme.accent, state: $magicEnabled)/patchCard(name: "Magic", target: "FREE FIRE • NORMAL", package: "OGIOS File (14).3105", color: AppTheme.accent, state: $magicEnabled)\
                    patchCard(name: "Mod Menu", target: "FREE FIRE • MAX\/TH", package: "OGIOS File (14).3105", color: AppTheme.accent, state: $magicEnabled)/g' "$TARGET_FILE"
          else
            echo "File ContentView.swift tidak ditemukan!"
            exit 1
          fi

      - name: Locate Xcode project
        id: locate
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=$(find "$ROOT" -name '*.xcodeproj' -type d -print -quit)
          WORKSPACE=$(find "$ROOT" -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then
            PROJECT=$(find . -name '*.xcodeproj' -type d -print -quit)
            WORKSPACE=$(find . -name '*.xcworkspace' -type d -not -path '*/Pods/*' -print -quit)
          fi
          if [ -z "$PROJECT" ] && [ -z "$WORKSPACE" ]; then exit 1; fi
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=OGIOS" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        env:
          PROJECT: ${{ steps.locate.outputs.project }}
          WORKSPACE: ${{ steps.locate.outputs.workspace }}
          SCHEME: ${{ steps.locate.outputs.scheme }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Package IPA
        env:
          IPA_NAME: ${{ inputs.project_name }}
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${IPA_NAME}.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
          
