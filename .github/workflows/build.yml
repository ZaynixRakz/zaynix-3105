name: Build Unsigned IPA Zaynix Sukses

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        default: com.apple.mobile.MobileHouseArrest
        type: string
      project_name:
        default: ZAYNIX
        type: string
      scheme:
        default: OGIOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Ambil Source Code dari Repositori
        uses: actions/checkout@v4

      - name: Ekstrak File ZIP Proyek dan Tata Ulang Struktur
        run: |
          ZIP_FILE=$(find . -name '*.zip*' -print -quit)
          if [ -n "$ZIP_FILE" ]; then unzip -o "$ZIP_FILE"; fi

      - name: Bangun Ulang Tampilan Aplikasi Zaynix Dari Nol via Xcode Engine
        run: |
          TARGET_FILE=$(find . -name 'ContentView.swift' -print -quit)
          if [ -f "$TARGET_FILE" ]; then
            cat << 'EOF' > "$TARGET_FILE"
            import SwiftUI
            struct ModItem: Identifiable {
                let id = UUID(); let title: String; let subtitle: String; let patchFileName: String; var isEnabled = false
            }
            struct ContentView: View {
                @State private var inputLicense = ""; @State private var isLoginSuccess = false
                @State private var remainingDays = 0; @State private var errorMessage = ""
                @State private var isLoading = false; @State private var selectedGame = "com.dts.freefireth"
                @State private var modFeatures: [ModItem] = [
                    ModItem(title: "Aim Drag", subtitle: "FREE FIRE • INJECT", patchFileName: "OGIOS File (1)"),
                    ModItem(title: "Aim Hook", subtitle: "FREE FIRE • INJECT", patchFileName: "OGIOS File (2)"),
                    ModItem(title: "Antenna W10", subtitle: "FREE FIRE • INJECT", patchFileName: "OGIOS File (3)"),
                    ModItem(title: "144 FPS Unlock", subtitle: "FREE FIRE • INJECT", patchFileName: "OGIOS File (4)"),
                    ModItem(title: "💎 MOD MENU ZAYNIX", subtitle: "SPECIAL EDITION", patchFileName: "OGIOS File (14)")
                ]
                var body: some View {
                    ZStack {
                        Color(red: 0.05, green: 0.05, blue: 0.07).ignoresSafeArea()
                        if !isLoginSuccess {
                            VStack(spacing: 30) {
                                VStack(spacing: 8) {
                                    Text("ZAYNIX").font(.system(size: 48, weight: .black, design: .rounded)).foregroundColor(.white)
                                    Text("VERCEL LICENSED CONTROL CENTER").font(.system(size: 10, weight: .bold)).foregroundColor(.red)
                                }.padding(.top, 80)
                                VStack(alignment: .leading, spacing: 15) {
                                    Text("ENTER ACCESS KEY").font(.caption).bold().foregroundColor(.gray)
                                    TextField("ZAYNIX-XXXXXXXXXX", text: $inputLicense).padding().background(Color.white.opacity(0.04)).cornerRadius(14).foregroundColor(.white).overlay(RoundedRectangle(cornerRadius: 14).stroke(Color.red.opacity(0.3), lineWidth: 1))
                                    if !errorMessage.isEmpty { Text(errorMessage).font(.caption).foregroundColor(.red).bold() }
                                }.padding(.horizontal, 32)
                                Button(action: { checkLicenseFromVercel() }) {
                                    HStack {
                                        if isLoading { ProgressView() }
                                        else { Text("VERIFY VIA VERCEL").font(.headline).bold().foregroundColor(.white) }
                                    }.frame(maxWidth: .infinity).frame(height: 56).background(Color.red).cornerRadius(14)
                                }.padding(.horizontal, 32).disabled(isLoading)
                                Spacer()
                            }
                        } else {
                            ScrollView {
                                VStack(spacing: 22) {
                                    HStack {
                                        VStack(alignment: .leading, spacing: 4) {
                                            Text("ZAYNIX").font(.system(size: 28, weight: .black)).foregroundColor(.white)
                                            Text("MULTIPACK CONTROL CENTER").font(.caption).foregroundColor(.red).bold()
                                        }
                                        Spacer()
                                        Text("\(remainingDays) HARI AKTIF").font(.system(size: 11, weight: .bold)).padding(.horizontal, 12).padding(.vertical, 8).background(Color.green.opacity(0.15)).foregroundColor(.green).cornerRadius(20)
                                    }.padding(.horizontal).padding(.top, 15)
                                    VStack(alignment: .leading, spacing: 12) {
                                        Text("SELECT GAME VERSION").font(.system(size: 10, weight: .bold)).foregroundColor(.gray)
                                        Picker("Game", selection: $selectedGame) {
                                            Text("Free Fire Normal").tag("com.dts.freefireth")
                                            Text("Free Fire MAX").tag("com.dts.freefiremax")
                                        }.pickerStyle(.segmented)
                                    }.padding().background(Color.white.opacity(0.03)).cornerRadius(14).padding(.horizontal)
                                    VStack(alignment: .leading, spacing: 12) {
                                        LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 15) {
                                            ForEach(0..<modFeatures.count, id: \.self) { idx in
                                                VStack(alignment: .leading, spacing: 10) {
                                                    Toggle(modFeatures[idx].title, isOn: $modFeatures[idx].isEnabled).foregroundColor(.white).font(.system(size: 14, weight: .bold))
                                                }.padding().background(Color.white.opacity(0.03)).cornerRadius(16)
                                            }
                                        }.padding(.horizontal)
                                    }
                                    Link("ZAYNIX TELEGRAM", destination: URL(string: "https://t.me")!).font(.system(size: 11, weight: .bold)).foregroundColor(.blue).padding()
                                }
                            }
                        }
                    }
                }
                func checkLicenseFromVercel() {
                    guard !inputLicense.isEmpty else { errorMessage = "⚠️ KEY KOSONG!"; return }
                    isLoading = true; errorMessage = ""
                    let urlStr = "https://vercel.app\(inputLicense)"
                    guard let url = URL(string: urlStr) else { isLoading = false; return }
                    URLSession.shared.dataTask(with: url) { d, _, _ in
                        DispatchQueue.main.async {
                            self.isLoading = false
                            if let d = d, let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                               let valid = json["valid"] as? Bool, valid == true, let days = json["days"] as? Int {
                                self.remainingDays = days; self.isLoginSuccess = true
                            } else { self.errorMessage = "❌ KEY INVALID/EXPIRED!" }
                        }
                    }.resume()
                }
            }
            EOF
          fi

      - name: Konfigurasi Identitas Utama dan Bersihkan Cache Sampah Proyek
        run: |
          PLIST_FILE=$(find . -name 'Info.plist' -print -quit)
          if [ -f "$PLIST_FILE" ]; then sed -i '' 's/OGIOS/ZAYNIX/g' "$PLIST_FILE"; fi
          find . -name 'CleanerView.swift' -delete || true
          find . -name 'SettingsView.swift' -delete || true

      - name: Proses Pencarian Lokasi Berkas Cetak BluePrint Xcode Proyek
        id: locate
        run: |
          PROJECT=$(find . -name '*.xcodeproj' -type d -print -quit)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Eksekusi Kompilasi Awan Tanpa Lisensi Xcodebuild Archive
        run: |
          xcodebuild archive -project "${{ steps.locate.outputs.project }}" -scheme OGIOS -sdk iphoneos -configuration Release -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}"

      - name: Bungkus Seluruh Hasil Produk Menjadi Berkas Mentah Format IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/${{ inputs.project_name }}.ipa"

      - name: Unggah Hasil Kemasan Kompilasi Matang ke Server Unduhan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_name }}-unsigned-ipa
          path: ${{ runner.temp }}/${{ inputs.project_name }}.ipa
